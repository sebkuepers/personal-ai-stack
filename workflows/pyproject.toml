[project]
name = "personal-ai-stack-workflows"
version = "0.1.0"
description = "A Mistral Workflows project"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.0.0,<4",
    "openpyxl>=3.1.5",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.0",
    "watchdog>=4.0",
    "rich>=15.0.0",
    "jsonpatch>=1.33",
]

[tool.uv]
# (scaffold shipped `exclude-newer = "7 days"`, which uv rejects — it expects an
# RFC3339 date. Dependencies are already pinned in uv.lock, so this is removed.)

[tool.ruff.lint]
# Explizite Regelauswahl statt ruff-Defaults: Ohne diesen Block ändert sich der
# Prüfumfang bei jedem ruff-Update (das SDK-Upgrade brachte schlagartig 62 neue
# Meldungen, 34 davon im unveränderten CRM-Code).
#
# Bewusst NICHT aktiviert:
#   I   (Import-Sortierung) — die Reihenfolge rund um
#       `with workflow.unsafe.imports_passed_through():` ist SEMANTISCH. Ein
#       automatisch verschobener Import bricht den Worker in der Temporal-Sandbox.
#       Genau dafür stehen die `# noqa: E402` in den Workflow-Modulen.
#   RUF100 (unnötige noqa) — würde ebendiese Marker entfernen wollen.
select = ["E", "F", "B", "UP"]
# E501 (Zeilenlänge): Die Codebasis hatte nie eine 88-Zeichen-Disziplin — 87 von
# 92 Meldungen waren das, quer durch alle Pillars. Nachträglich erzwingen hieße,
# jede Datei umzuformatieren, ohne dass ein Fehler verschwindet.
ignore = [
  "E501",
  # B008: `Depends()` im Argument-Default IST das vorgeschriebene
  # Dependency-Injection-Muster des Mistral-SDK (wie bei FastAPI).
  "B008",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entrypoints", "src/workflows", "src/examples", "src/bookcli", "src/financecli", "src/evalkit"]

[tool.hatch.build.targets.wheel.sources]
"src/worker.py" = "worker.py"
